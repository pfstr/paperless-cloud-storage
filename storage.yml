# Cloud storage layer — independent of Paperless.
#
# One container mounts every entry from mounts.conf (written by ./wizard.sh)
# and publishes the mounts to the host, from where Paperless consumes them.
# No web UI, no open ports: configuration happens through ./wizard.sh, and
# mount definitions persist in $BASE_DIR/rclone-config/mounts.conf.
#
# Self-healing: if a mount dies, the container exits and Docker restarts it;
# Paperless picks the fresh mount up without a restart of its own (rslave).
#
# Prerequisite: sudo ./setup.sh — the media directory must be a SHARED mount
# point or the container cannot publish its mounts to the host.
#
# Run:  docker compose -f storage.yml up -d   (wizard.sh does this for you)

services:
  rclone:
    image: rclone/rclone:latest
    container_name: rclone-mounts
    restart: unless-stopped

    entrypoint: ["/bin/sh", "/usr/local/bin/mount-runner.sh"]

    environment:
      # Upper bound for the local VFS cache. Enforced by a cleanup pass about
      # once per minute — during bursts the cache can temporarily exceed it.
      VFS_CACHE_MAX: ${VFS_CACHE_MAX:-1G}

    # FUSE inside a container needs all three of these.
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined

    volumes:
      # rclone.conf + mounts.conf — cloud credentials and mount definitions.
      - ${BASE_DIR:?set BASE_DIR in .env}/rclone-config:/config/rclone
      # VFS cache: bounds how much of the archive is held locally.
      - ${BASE_DIR:?}/cache:/cache
      - ./mount-runner.sh:/usr/local/bin/mount-runner.sh:ro
      # rshared: lets mounts created inside this container appear on the
      # host, from where Paperless picks them up via rslave.
      - type: bind
        source: ${BASE_DIR:?}/media
        target: /data
        bind:
          propagation: rshared

    healthcheck:
      # healthy = every configured mount answers
      test: ["CMD", "/bin/sh", "-c",
             "grep -vE '^\\s*(#|$$)' /config/rclone/mounts.conf | while read -r fs rel _; do grep -q \" /mnt/inner/$$rel \" /proc/self/mountinfo && timeout 10 ls /mnt/inner/$$rel >/dev/null || exit 1; done"]
      interval: 60s
      timeout: 30s
      retries: 2
      start_period: 60s
